# [INPUT]: 明确手动请求的T3完整旧桌面清单与隔离macOS环境。
# [OUTPUT]: 保留原场景/失败/跳过/取消及原件，不提供T1 Required checks或发布资格。
# [POS]: 旧专项逐项迁移入口；不加载真实供应商凭据。
# [PROTOCOL]: 修改同步Header与本目录.folder.md。
name: T3 legacy desktop regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
          pnpm exec electron --version
      - run: pnpm build
      - run: node scripts/test-desktop.mjs t3 --output .local/t3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t3-legacy-evidence
          path: |
            .local/t3/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
