# [INPUT]: Fixed natural-minute automation tests and unchanged product source.
# [OUTPUT]: Four real Electron approval/refusal/UI-stop/disconnection cases without retries, fake clocks or manual triggers.
# [POS]: Isolated DS11 diagnostic; not formal Required checks or real-provider quality qualification.
# [PROTOCOL]: Changes update Header; original CPU diagnostic retained outside tracked workflow.
name: Natural automation stability diagnostic
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  natural:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install locked dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Check current types
        run: pnpm typecheck
      - name: Bind exact product and scenario candidate
        run: |
          node --input-type=module - <<'JS'
          import { buildInputHash } from './scripts/build-identity.mjs';
          import { mkdir, writeFile } from 'node:fs/promises';
          const inputHash = await buildInputHash();
          if (inputHash !== 'bbdd926c21c351c4745cec2eeaf0124240907e5c83df40d9fe007f4860a0cad3') throw Error('Product inputs differ');
          await mkdir('.local/daily-natural', { recursive: true });
          await writeFile('.local/daily-natural/source.json', JSON.stringify({ testCandidate: '64db4e8ab3ee25910ed706bc5fcf50780c7666f1', inputHash, actualMinuteBoundary: true, realProviderCalls: false, manualTrigger: false, fakeClock: false, cases: 4, retries: 0, originalDeadlinesAndAssertionsUnchanged: true }, null, 2));
          JS
      - name: Build current candidate and original BDD framework
        run: |
          pnpm build
          pnpm test:bddgen
      - name: Freeze four cases and run without retries
        env:
          BOAI_TEST_DEV_SERVER: '1'
        run: |
          node --input-type=module - <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const directory = '.local/daily-natural', base = ['exec', 'playwright', 'test', '.features-gen/natural-automation.feature.spec.js', '--retries', '0'];
          execFileSync('pnpm', [...base, '--list', '--reporter=json'], { stdio: 'inherit', env: { ...process.env, PLAYWRIGHT_JSON_OUTPUT_NAME: `${directory}/list.json` } });
          const listed = JSON.parse(readFileSync(`${directory}/list.json`, 'utf8'));
          const count = suite => (suite.specs ?? []).reduce((sum, spec) => sum + (spec.tests ?? []).length, 0) + (suite.suites ?? []).reduce((sum, child) => sum + count(child), 0);
          if (count(listed) !== 4) throw Error('Expected exactly four natural cases');
          execFileSync('pnpm', [...base, '--reporter=list,json'], { stdio: 'inherit', env: { ...process.env, BOAI_REVIEW_RUN_DIR: `${directory}/review`, PLAYWRIGHT_JSON_OUTPUT_NAME: `${directory}/playwright-results.json` } });
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-natural-automation
          path: |
            .local/daily-natural/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
