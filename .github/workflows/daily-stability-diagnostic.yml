# [INPUT]: 第23组当前配置快照/零调用准备及原完整备份候选，隔离固定数据。
# [OUTPUT]: 类型与原模块定向验收，保留JSON/日志；不提供Required checks或真实模型成绩。
# [POS]: 独立诊断分支，原源码身份专项已完成后接续记忆/恢复验证。
# [PROTOCOL]: 一旦本文件变化，必须同步更新Header，并上浮检查所属目录.folder.md。
name: Daily stability follow-up
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparation-and-restore:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install locked dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: Check original types
        run: pnpm typecheck
      - name: Read-only profile and zero-call review regression
        run: |
          mkdir -p .local/daily-stability-followup
          pnpm exec vitest run tests/evaluation-profile.test.ts --maxWorkers=2 --reporter=default --reporter=json --outputFile=.local/daily-stability-followup/profile.json
      - name: Original complete backup with configuration and memory
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run tests/service.test.ts --maxWorkers=2 -t 'exports a consistent credential-free backup that opens from a different data directory' --reporter=default --reporter=json --outputFile=.local/daily-stability-followup/restore.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-stability-followup
          path: .local/daily-stability-followup/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
