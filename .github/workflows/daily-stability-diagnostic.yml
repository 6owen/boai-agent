# [INPUT]: Same product dependencies and the actual React Aria ESM/CJS transition utility.
# [OUTPUT]: Red-capable cancellation regression on macOS, no dependency or product patch yet.
# [POS]: Temporary daily stability root-cause diagnostic; not Required checks.
# [PROTOCOL]: Changes update Header and workflow directory map.
name: Daily transition cancellation regression
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transition-regression:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check original types
        run: pnpm typecheck
      - name: Exercise actual dependency transition cancellation
        run: pnpm exec vitest run --maxWorkers=2 tests/react-aria-transition.test.ts --reporter=default --reporter=json --outputFile=.local/transition-unit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-transition-regression
          path: .local/transition-unit.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
