# [INPUT]: 第23组当前候选与原统一记忆管理BDD，真实开发版Electron/隔离数据。
# [OUTPUT]: 原添加/固定/忘记/冲突草稿/来源限制/升级/重启场景原件；不提供Required checks。
# [POS]: 独立诊断分支，配置/完整备份模块专项通过后补实际记忆管理UI。
# [PROTOCOL]: 一旦本文件变化，必须同步更新Header，并上浮检查所属目录.folder.md。
name: Daily memory management
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory-ui:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install locked dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Build original candidate
        run: pnpm build
      - name: Generate original BDD
        run: pnpm test:bddgen
      - name: Original unified memory management
        env:
          BOAI_TEST_DEV_SERVER: '1'
          BOAI_REVIEW_RUN_DIR: .local/daily-memory-ui
          PLAYWRIGHT_JSON_OUTPUT_NAME: .local/daily-memory-ui/playwright-results.json
        run: pnpm exec playwright test --grep '统一管理保留来源范围并持久化' --retries 0 --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-memory-ui
          path: |
            .local/daily-memory-ui/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
