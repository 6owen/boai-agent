# [INPUT]: Same fixed product inputs and the isolated original hung-page closure case and its actual manager regression seam.
# [OUTPUT]: Actual destroyed-page wait regression and isolated hung renderer toolbar closure/reopen; original assertions, deadlines and thresholds unchanged.
# [POS]: DS05/DS13 browser lifecycle evidence, offline supplier protocol; not Required checks or all-day certification.
# [PROTOCOL]: Changes update Header and workflow directory map.
name: Daily hung page exit red proof
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-lifecycle:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install locked dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Check original types
        run: pnpm typecheck
      - name: Bind exact product and test inputs
        run: |
          node --input-type=module - <<'JS'
          import { buildInputHash } from './scripts/build-identity.mjs';
          import { mkdir, writeFile } from 'node:fs/promises';
          const inputHash = await buildInputHash();
          if (inputHash !== '5a82db0e4d0010e4946714c47b406eb7f4fc711a9c50bb6f42adb0ec949e0951') throw Error('Product inputs differ');
          await mkdir('.local/daily-browser-lifecycle', { recursive: true });
          await writeFile('.local/daily-browser-lifecycle/source.json', JSON.stringify({ reference: '9fb016acab51cdb6a393fd66699846dd0630d195', testCandidate: '2a54701739b6512a88df8204337292c6dbeb50bd', inputHash, cases: 1, feature: 'browser-migration.feature', realProviderCalls: false, resourceContractUnchanged: true }, null, 2));
          JS
      - name: Build current candidate and original BDD
        id: build
        run: |
          pnpm build
          pnpm test:bddgen
      - name: Verify actual browser wait destruction and original CDP drain contracts
        run: pnpm exec vitest run tests/browser-pane-manager.test.ts tests/browser-cdp-input.test.ts tests/browser-host.test.ts tests/browser-runtime.test.ts --maxWorkers=2 --reporter=json --outputFile .local/daily-browser-lifecycle/module-results.json
      - name: Run isolated original hung renderer closure
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          BOAI_TEST_DEV_SERVER: '1'
          BOAI_REVIEW_RUN_DIR: .local/daily-browser-lifecycle/review
          PLAYWRIGHT_JSON_OUTPUT_NAME: .local/daily-browser-lifecycle/playwright-results.json
        run: pnpm exec playwright test .features-gen/browser-migration.feature.spec.js --grep '网页脚本卡住后仍可关闭浏览器并重新打开' --retries 0 --reporter=list,json
      - name: Preserve native crash reports on failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          output = Path('.local/daily-browser-lifecycle/native-crashes')
          output.mkdir(parents=True, exist_ok=True)
          reports = sorted((Path.home() / 'Library/Logs/DiagnosticReports').glob('*.ips'), key=lambda path: path.stat().st_mtime, reverse=True)
          for path in reports[:5]:
              copyfile(path, output / path.name)
          print('Native crash reports:', min(len(reports), 5))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-browser-lifecycle
          path: |
            .local/daily-browser-lifecycle/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
