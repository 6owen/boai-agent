# [INPUT]: Fixed product source, original 18 accepted UI baselines and explicit conversation readiness candidate.
# [OUTPUT]: Full original zero-pixel UI comparison; no masks, snapshot acceptance, deadline changes or retries.
# [POS]: Isolated UI preparation verification after original 376 chat-light failure, not formal Required checks.
# [PROTOCOL]: Changes update Header; native group diagnostic retained separately.
name: Conversation readiness original UI comparison
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui_readiness:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install locked dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Check current types
        run: pnpm typecheck
      - name: Bind fixed source and original comparison contract
        run: |
          node --input-type=module - <<'JS'
          import { buildInputHash } from './scripts/build-identity.mjs';
          import { mkdir, writeFile, readFile } from 'node:fs/promises';
          const inputHash = await buildInputHash(), contract = JSON.parse(await readFile('tests/e2e/baselines/contract.json', 'utf8'));
          if (inputHash !== 'f2b4fc421bdf39dd4011365a6b400c57da0d5d14f7397fd01780b76388a1bbb4') throw Error('Product inputs differ');
          if (contract.cases.length !== 18 || contract.threshold !== 0 || contract.maxDiffPixels !== 0 || contract.masks.length) throw Error('Original UI comparison contract differs');
          await mkdir('.local/daily-ui-readiness', { recursive: true });
          await writeFile('.local/daily-ui-readiness/source.json', JSON.stringify({ testCandidate: '4db5f22c1c25fa0636107e6b3433fc3c05ddfc06', originalFailureRun: 39690280925, inputHash, cases: contract.cases.map(c => c.id), realProviders: false, baselineChanged: false, threshold: 0, maxDiffPixels: 0, masks: [], retries: 0, oldDeadlinesUnchanged: true }, null, 2));
          JS
      - name: Build unchanged product
        run: pnpm build
      - name: Compare all original accepted UI cases
        run: node scripts/ui-regression.mjs check --profile github-macos15-arm64 --output .local/daily-ui-readiness/ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-ui-readiness
          path: .local/daily-ui-readiness/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
