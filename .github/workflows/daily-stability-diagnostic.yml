# [INPUT]: 当前候选完整备份测试和固定旧源码fbe95154，隔离数据与相同锁定依赖。
# [OUTPUT]: 候选导出后旧版本数据入口/运行时异路径恢复与二次打开；原断言保持，原准备失败保留。
# [POS]: 仅修正浅克隆未取得旧对象的准备问题；不重复已通过的UI或提供Required checks。
# [PROTOCOL]: 一旦本文件变化，必须同步更新Header，并上浮检查所属目录.folder.md。
name: Daily fixed-source rollback
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rollback:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install locked dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: Build the explicitly fetched previous runtime
        run: |
          mkdir -p .local/daily-rollback-evidence
          git fetch --no-tags --depth=1 origin fbe95154edfeaf304b06258e539c162f9c6fa018
          git worktree add --detach .local/daily-rollback/source fbe95154edfeaf304b06258e539c162f9c6fa018
          node --input-type=module - <<'JS'
          import { build } from 'esbuild';
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const old = execFileSync('git',['-C','.local/daily-rollback/source','rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if (old !== 'fbe95154edfeaf304b06258e539c162f9c6fa018') throw Error('Unexpected rollback source');
          const previousLock=await readFile('.local/daily-rollback/source/pnpm-lock.yaml'),candidateLock=await readFile('pnpm-lock.yaml');
          if (!previousLock.equals(candidateLock)) throw Error('Rollback dependencies differ; no compatibility claim');
          await build({stdin:{contents:"export { AppService } from './.local/daily-rollback/source/src/runtime/service.ts'; export { prepareV2DataRoot } from './.local/daily-rollback/source/src/main/migration.ts'",resolveDir:process.cwd()},outfile:'.local/daily-rollback/previous-app.mjs',bundle:true,platform:'node',format:'esm',packages:'external',target:'node24'});
          await writeFile('.local/daily-rollback-evidence/source.json',JSON.stringify({previous:old,candidate:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),lockSha256:createHash('sha256').update(candidateLock).digest('hex'),scope:'candidate export, previous data-version entry/runtime restore and second reopen; original backup assertions retained'},null,2));
          JS
      - name: Restore the candidate export with the fixed previous data entry and runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('tests/service.test.ts')
          original=p.read_text()
          constructor='new AppService({ dataPath: restorePath'
          location="const restorePath = join(root, 'restored'); await cp(destination, restorePath, { recursive: true })"
          if original.count(constructor)!=2 or original.count(location)!=1:
              raise SystemExit('Original restore seam changed')
          patched="import { AppService as PreviousAppService, prepareV2DataRoot as previousDataRoot } from '../.local/daily-rollback/previous-app.mjs'\n"+original.replace(constructor,'new PreviousAppService({ dataPath: restorePath')
          patched=patched.replace(location,"const restoreParent = join(root, 'restored'), restorePath = join(restoreParent, 'v2'); await cp(destination, restorePath, { recursive: true }); expect(await previousDataRoot(restoreParent)).toBe(restorePath)")
          try:
              p.write_text(patched)
              diff=subprocess.run(['git','diff','--','tests/service.test.ts'],capture_output=True,text=True,check=True).stdout
              Path('.local/daily-rollback-evidence/harness.patch').write_text(diff)
              outcome=subprocess.run(['pnpm','exec','vitest','run','tests/service.test.ts','--maxWorkers=2','-t','exports a consistent credential-free backup that opens from a different data directory','--reporter=default','--reporter=json','--outputFile=.local/daily-rollback-evidence/previous-restore.json'])
          finally:
              p.write_text(original)
          raise SystemExit(outcome.returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-fixed-rollback
          path: .local/daily-rollback-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
