# [INPUT]: Exact current product inputs and actual GUI backup/cold restore case, original artifact offline supplier protocol.
# [OUTPUT]: Native chooser cancellation/export, old managed/external paths unavailable, documented independent restore and second cold restart; no real provider calls.
# [POS]: DS14 bounded desktop evidence; not Required checks, personal profile or arbitrary-version certification.
# [PROTOCOL]: Changes update Header and workflow directory map.
name: Daily GUI backup and cold restore
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gui-backup:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install locked dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Check current types
        run: pnpm typecheck
      - name: Bind exact product and new desktop inputs
        run: |
          node --input-type=module - <<'JS'
          import { buildInputHash } from './scripts/build-identity.mjs';
          import { mkdir, writeFile } from 'node:fs/promises';
          const inputHash = await buildInputHash();
          if (inputHash !== 'bbdd926c21c351c4745cec2eeaf0124240907e5c83df40d9fe007f4860a0cad3') throw Error('Product inputs differ');
          await mkdir('.local/daily-gui-backup', { recursive: true });
          await writeFile('.local/daily-gui-backup/source.json', JSON.stringify({ reference: 'e8f90e745d5aa48074dc9779dbd9d52b87ade3d5', testCandidate: '72b53b6efcaf8272ed829a5e1589125def577cbe', inputHash, cases: 1, feature: 'backup-restoration.feature', realProviderCalls: false, coldStarts: 3, newCaseTimeoutMs: 240000, originalCaseBudgetsUnchanged: true, restore: 'documented manual copy to independent userData/v2', oldManagedAndExternalPathsUnavailable: true }, null, 2));
          JS
      - name: Build current candidate and original BDD framework
        run: |
          pnpm build
          pnpm test:bddgen
      - name: Run actual UI export and independent cold restoration
        env:
          BOAI_TEST_DEV_SERVER: '1'
          BOAI_REVIEW_RUN_DIR: .local/daily-gui-backup/review
          PLAYWRIGHT_JSON_OUTPUT_NAME: .local/daily-gui-backup/playwright-results.json
        run: pnpm exec playwright test .features-gen/backup-restoration.feature.spec.js --retries 0 --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-gui-backup
          path: |
            .local/daily-gui-backup/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
