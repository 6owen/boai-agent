# [INPUT]: Same current product inputs, new PDF Office resource case corrected for the existing single-tab close contract.
# [OUTPUT]: Independent natural/forced-GC CPU phases and renderer CPU profile; original failing resource contract is unchanged and not qualified by this probe.
# [POS]: DS13 bounded PDF/Office desktop evidence; not Required checks or all-day stability certification.
# [PROTOCOL]: Changes update Header and workflow directory map.
name: Daily preview CPU attribution only
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-resources:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install locked dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Check current types
        run: pnpm typecheck
      - name: Bind exact product and new desktop inputs
        run: |
          node --input-type=module - <<'JS'
          import { buildInputHash } from './scripts/build-identity.mjs';
          import { mkdir, writeFile } from 'node:fs/promises';
          const inputHash = await buildInputHash();
          if (inputHash !== 'bbdd926c21c351c4745cec2eeaf0124240907e5c83df40d9fe007f4860a0cad3') throw Error('Product inputs differ');
          await mkdir('.local/daily-preview-cpu', { recursive: true });
          await writeFile('.local/daily-preview-cpu/source.json', JSON.stringify({ reference: 'e8f90e745d5aa48074dc9779dbd9d52b87ade3d5', testCandidate: '32acab4a155b95b214044d85abfd4fcf3976ec2e', inputHash, cases: 1, feature: 'preview-cpu-diagnostic.feature', realProviderCalls: false, diagnosticCycles: 3, naturalCpuSamples: 10, forcedGcSamples: 5, cpuProfileSeconds: 5, diagnosticOnly: true, originalCaseBudgetsUnchanged: true, resourceContract: 'existing verifyResources unchanged', oldLatePreviewCasesPassedRun: 39674867840 }, null, 2));
          JS
      - name: Build current candidate and original BDD framework
        run: |
          pnpm build
          pnpm test:bddgen
      - name: Attribute CPU after real preview closure without changing original resource verdict
        env:
          BOAI_TEST_DEV_SERVER: '1'
          BOAI_REVIEW_RUN_DIR: .local/daily-preview-cpu/review
          PLAYWRIGHT_JSON_OUTPUT_NAME: .local/daily-preview-cpu/playwright-results.json
        run: pnpm exec playwright test .features-gen/preview-cpu-diagnostic.feature.spec.js --retries 0 --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-preview-cpu
          path: |
            .local/daily-preview-cpu/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
