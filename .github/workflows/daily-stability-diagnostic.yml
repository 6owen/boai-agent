# [INPUT]: Original bounded history-reading scenario and unchanged product source.
# [OUTPUT]: One original real Electron 10000-message history scenario with latest-sidebar assertions; no providers, retries or deadline changes.
# [POS]: Isolated DS02 diagnostic; not formal Required checks or real-provider quality qualification.
# [PROTOCOL]: Changes update Header; original CPU diagnostic retained outside tracked workflow.
name: History sidebar preview diagnostic
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reading_preview:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install locked dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Check current types
        run: pnpm typecheck
      - name: Bind exact product and scenario candidate
        run: |
          node --input-type=module - <<'JS'
          import { buildInputHash } from './scripts/build-identity.mjs';
          import { mkdir, writeFile } from 'node:fs/promises';
          const inputHash = await buildInputHash();
          if (inputHash !== '98be19b5e50f47cbab30c0b159aaeee2ab9733fc710c8bdca768394ffa40ec04') throw Error('Product inputs differ');
          await mkdir('.local/daily-reading-preview', { recursive: true });
          await writeFile('.local/daily-reading-preview/source.json', JSON.stringify({ productCandidate: '2c949947bf1d22e67cc99485aee00092563d8dcf', testCandidate: '3ba1521b074adaf4e50dc2cfcd7f9c6a32c9c0c0', inputHash, realProviderCalls: false, originalHistoryCount: 10000, latestSidebarAfterOldLocationAndRestart: true, cases: 1, retries: 0, originalDeadlinesAndAssertionsUnchanged: true }, null, 2));
          JS
      - name: Build current candidate and original BDD framework
        run: |
          pnpm build
          pnpm test:bddgen
      - name: Freeze original history case and run without retries
        env:
          BOAI_TEST_DEV_SERVER: '1'
        run: |
          node --input-type=module - <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const directory = '.local/daily-reading-preview', base = ['exec', 'playwright', 'test', '.features-gen/reading.feature.spec.js', '--grep', '万条旧历史同文搜索保持原身份和有界窗口', '--retries', '0'];
          execFileSync('pnpm', [...base, '--list', '--reporter=json'], { stdio: 'inherit', env: { ...process.env, PLAYWRIGHT_JSON_OUTPUT_NAME: `${directory}/list.json` } });
          const listed = JSON.parse(readFileSync(`${directory}/list.json`, 'utf8'));
          const count = suite => (suite.specs ?? []).reduce((sum, spec) => sum + (spec.tests ?? []).length, 0) + (suite.suites ?? []).reduce((sum, child) => sum + count(child), 0);
          if (count(listed) !== 1) throw Error('Expected exactly one original bounded history case');
          execFileSync('pnpm', [...base, '--reporter=list,json'], { stdio: 'inherit', env: { ...process.env, BOAI_REVIEW_RUN_DIR: `${directory}/review`, PLAYWRIGHT_JSON_OUTPUT_NAME: `${directory}/playwright-results.json` } });
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-reading-preview
          path: |
            .local/daily-reading-preview/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
