# [INPUT]: Explicit task page candidate, original application protocol and fixed product inputs.
# [OUTPUT]: Nine real SQLite task contracts and unchanged application protocol regression; no real providers or GUI.
# [POS]: Isolated DU3 data foundation diagnostic; not formal Required checks or real-user acceptance.
# [PROTOCOL]: Changes update Header; temporary workflow stays on the diagnostic branch.
name: Explicit task page contract diagnostic
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task_pages:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install locked dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Check current types
        run: pnpm typecheck
      - name: Bind exact task query source
        run: |
          node --input-type=module - <<'JS'
          import { buildInputHash } from './scripts/build-identity.mjs';
          import { mkdir,writeFile } from 'node:fs/promises';
          const inputHash=await buildInputHash();
          if(inputHash!=='772c88a2147f6c459209b81fdbc8a91798866b9e45bc91fc78de1fc40ac3bc99')throw Error('Task product input differs');
          await mkdir('.local/daily-task-pages',{recursive:true});
          await writeFile('.local/daily-task-pages/source.json',JSON.stringify({candidate:'e6ec6a25b8b7905361401c451151df29de465237',inputHash,newContractCases:9,realProviderCalls:false,personalData:false,gui:false,originalRegressionAssertionsUnchanged:true},null,2));
          JS
      - name: Build current candidate for original integration tests
        run: pnpm build
      - name: Run nine task contracts once
        run: |
          pnpm exec vitest run tests/task-pages.test.ts --maxWorkers=2 --reporter=json --outputFile=.local/daily-task-pages/tasks.json
          node --input-type=module - <<'JS'
          import {readFile} from 'node:fs/promises';
          const r=JSON.parse(await readFile('.local/daily-task-pages/tasks.json','utf8'));
          if(r.numTotalTests!==9||r.numPassedTests!==9||r.success!==true)throw Error('All nine task contracts must actually pass');
          JS
      - name: Run original application protocol regression
        run: pnpm exec vitest run tests/application-protocol.test.ts --maxWorkers=2 --reporter=json --outputFile=.local/daily-task-pages/application.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-task-pages
          path: .local/daily-task-pages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
