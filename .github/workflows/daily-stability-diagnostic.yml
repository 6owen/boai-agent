# [INPUT]: Same 9fb product inputs and d8c3b8df explicit command capability fixture; original six directory BDD cases.
# [OUTPUT]: Current dev-mode directory approval/refusal/temp grants/native configuration/restart evidence; original assertions and deadlines unchanged.
# [POS]: DS08 targeted cloud evidence, not Required checks or real provider certification.
# [PROTOCOL]: Changes update Header and workflow directory map.
name: Daily directory permission lifecycle
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  directory-permissions:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install locked dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Check original types
        run: pnpm typecheck
      - name: Bind exact product inputs
        run: |
          node --input-type=module - <<'JS'
          import { buildInputHash } from './scripts/build-identity.mjs';
          import { mkdir, writeFile } from 'node:fs/promises';
          const inputHash = await buildInputHash();
          if (inputHash !== '5a82db0e4d0010e4946714c47b406eb7f4fc711a9c50bb6f42adb0ec949e0951') throw Error('Product inputs differ');
          await mkdir('.local/daily-permissions', { recursive: true });
          await writeFile('.local/daily-permissions/source.json', JSON.stringify({ reference: '9fb016acab51cdb6a393fd66699846dd0630d195', inputHash, testCandidate: 'd8c3b8df2563238e6dc38bf05e7ff0ce739b3554', cases: 6, originalFeature: 'directory-permissions.feature', realProviderCalls: false }, null, 2));
          JS
      - name: Build current candidate and original BDD
        run: |
          pnpm build
          pnpm test:bddgen
      - name: Run original directory permission cases
        env:
          BOAI_TEST_DEV_SERVER: '1'
          BOAI_REVIEW_RUN_DIR: .local/daily-permissions/review
          PLAYWRIGHT_JSON_OUTPUT_NAME: .local/daily-permissions/playwright-results.json
        run: pnpm exec playwright test .features-gen/directory-permissions.feature.spec.js --retries 0 --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-directory-permissions
          path: |
            .local/daily-permissions/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
