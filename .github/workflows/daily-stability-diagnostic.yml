# [INPUT]: Exact current product inputs, actual PDF Office resource scenario and two original late-preview lifecycle cases.
# [OUTPUT]: Seven measured preview cycles after one warmup, five idle samples, original shared limits and unchanged late/clear assertions; no real provider calls.
# [POS]: DS13 bounded PDF/Office desktop evidence; not Required checks or all-day stability certification.
# [PROTOCOL]: Changes update Header and workflow directory map.
name: Daily PDF Office lifecycle and resources
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-resources:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install locked dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Check current types
        run: pnpm typecheck
      - name: Bind exact product and new desktop inputs
        run: |
          node --input-type=module - <<'JS'
          import { buildInputHash } from './scripts/build-identity.mjs';
          import { mkdir, writeFile } from 'node:fs/promises';
          const inputHash = await buildInputHash();
          if (inputHash !== 'bbdd926c21c351c4745cec2eeaf0124240907e5c83df40d9fe007f4860a0cad3') throw Error('Product inputs differ');
          await mkdir('.local/daily-preview-resources', { recursive: true });
          await writeFile('.local/daily-preview-resources/source.json', JSON.stringify({ reference: 'e8f90e745d5aa48074dc9779dbd9d52b87ade3d5', testCandidate: '1003b053380c79dc8e276fec5cca3fb452aedaae', inputHash, cases: 3, feature: 'materials.feature', realProviderCalls: false, measuredCycles: 7, warmupCycles: 1, idleSamples: 5, originalCaseBudgetsUnchanged: true, resourceContract: 'existing verifyResources unchanged', oldLatePreviewCases: 2 }, null, 2));
          JS
      - name: Build current candidate and original BDD framework
        run: |
          pnpm build
          pnpm test:bddgen
      - name: Run actual PDF Office resources and original late preview lifecycle
        env:
          BOAI_TEST_DEV_SERVER: '1'
          BOAI_REVIEW_RUN_DIR: .local/daily-preview-resources/review
          PLAYWRIGHT_JSON_OUTPUT_NAME: .local/daily-preview-resources/playwright-results.json
        run: pnpm exec playwright test .features-gen/materials.feature.spec.js --grep 'PDF和Office反复切换关闭后的短期资源有界|Lody迟到预览不会覆盖新文件且关闭停读|Lody二进制迟到预览不会恢复清空来源' --retries 0 --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-preview-resources
          path: |
            .local/daily-preview-resources/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
