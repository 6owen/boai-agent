# [INPUT]: 第23组d6714911产品候选及原CLI桌面场景，独立协议与数据目录。
# [OUTPUT]: 已加载源码身份的真实编译/模块及pnpm dev桌面-CLI-重启核验；不提供Required checks。
# [POS]: 独立诊断分支，仅核现有源码身份及原业务场景。
# [PROTOCOL]: 一旦本文件变化，必须同步更新Header，并上浮检查所属目录.folder.md。
name: Daily source identity
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Check actual compiled provenance
        run: pnpm exec vitest run tests/runtime-versions.test.ts tests/build-identity.test.ts --maxWorkers=2
      - name: Build candidate
        run: pnpm build
      - name: Generate original BDD
        run: pnpm test:bddgen
      - name: Actual development desktop and standalone CLI
        env:
          BOAI_TEST_DEV_SERVER: '1'
          BOAI_REVIEW_RUN_DIR: .local/source-identity-desktop
          PLAYWRIGHT_JSON_OUTPUT_NAME: .local/source-identity-desktop/playwright-results.json
        run: pnpm exec playwright test --grep '独立CLI构建与桌面在同一私聊交替发送并在重启后核对' --retries 0 --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-source-identity
          path: |
            .local/source-identity-desktop/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
