# [INPUT]: Exact current product inputs, original actual PTY/application facade and native terminal sidebar.
# [OUTPUT]: Two employee child PID isolation, seven actual terminal UI lifecycles/five idle samples, original resource limits and real close/restart; no model calls.
# [POS]: DS05/DS12/DS13 bounded terminal desktop evidence; not Required checks, shell RSS or all-day stability certification.
# [PROTOCOL]: Changes update Header and workflow directory map.
name: Daily terminal actual exit and resources
on:
  push:
    branches: [infra/daily-source-identity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal-lifecycle:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - name: Install locked dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Check current types
        run: pnpm typecheck
      - name: Bind exact product and new desktop inputs
        run: |
          node --input-type=module - <<'JS'
          import { buildInputHash } from './scripts/build-identity.mjs';
          import { mkdir, writeFile } from 'node:fs/promises';
          const inputHash = await buildInputHash();
          if (inputHash !== 'bbdd926c21c351c4745cec2eeaf0124240907e5c83df40d9fe007f4860a0cad3') throw Error('Product inputs differ');
          await mkdir('.local/daily-terminal-lifecycle', { recursive: true });
          await writeFile('.local/daily-terminal-lifecycle/source.json', JSON.stringify({ reference: 'e8f90e745d5aa48074dc9779dbd9d52b87ade3d5', testCandidate: 'c6c29bc485177d10477ad7b61432110faf2d7945', inputHash, cases: 1, feature: 'terminal-lifecycle.feature', realProviderCalls: false, cycles: 7, idleSamples: 5, newCaseTimeoutMs: 180000, originalCaseBudgetsUnchanged: true, resourceContract: 'existing verifyResources unchanged', actualChildPids: true, twoEmployeeScopes: true, shellMemoryMeasured: false }, null, 2));
          JS
      - name: Build current candidate and original BDD framework
        run: |
          pnpm build
          pnpm test:bddgen
      - name: Run actual terminal isolation resources and real exit/restart
        env:
          BOAI_TEST_DEV_SERVER: '1'
          BOAI_REVIEW_RUN_DIR: .local/daily-terminal-lifecycle/review
          PLAYWRIGHT_JSON_OUTPUT_NAME: .local/daily-terminal-lifecycle/playwright-results.json
        run: pnpm exec playwright test .features-gen/terminal-lifecycle.feature.spec.js --retries 0 --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-terminal-lifecycle
          path: |
            .local/daily-terminal-lifecycle/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
