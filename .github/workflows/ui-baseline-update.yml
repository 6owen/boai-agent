# [INPUT]: Agent按需求审阅后的官方候选run、已审阅SHA、明确case和原因。
# [OUTPUT]: 在线提交受影响基准；Agent接续创建/批准PR只读CI，不重复dispatch或把独立检查冒充PR门禁。
# [POS]: 仅main受信代码执行写入；功能分支仅作为只读源码/合同，不执行其脚本。
# [PROTOCOL]: 修改同步Header、目录地图及共享开发Skill。
name: UI baseline update
run-name: UI baseline ${{ inputs.candidate_run }} ${{ inputs.approved_head }}
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful official candidate run ID
        required: true
        type: string
      approved_head:
        description: Full feature commit SHA reviewed by agent
        required: true
        type: string
      cases:
        description: Reviewed case IDs, comma separated
        required: true
        type: string
      reason:
        description: Requirement and per-case review decision
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: ui-baseline-update-${{ inputs.candidate_run }}
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ui-dependencies
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_head }}
          path: .local/ui-update-target
          persist-credentials: false
      - name: Update reviewed baselines for PR verification
        env:
          GH_TOKEN: ${{ github.token }}
          UI_CANDIDATE_RUN: ${{ inputs.candidate_run }}
          UI_APPROVED_HEAD: ${{ inputs.approved_head }}
          UI_APPROVED_CASES: ${{ inputs.cases }}
          UI_APPROVAL_REASON: ${{ inputs.reason }}
        run: node scripts/ui-baseline-update.mjs
