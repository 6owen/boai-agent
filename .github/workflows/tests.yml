# [OUTPUT]: PR先采集并分类；视觉待审阅保持Required pending，基准提交后两片只读复验。
# [OUTPUT]: 两级依赖缓存精确命中跳过安装；完整UI与原件门禁按版本化合同执行。
# [INPUT]: 面向 main 的 PR、main push 或手动触发；版本化 UI 合同与已接受基线。
# [OUTPUT]: 源码更新全UI只读比较；Draft/Ready不重复触发同SHA，原Required checks和main复验保持。
# [POS]: 唯一自动测试工作流，不运行模块、模型连接、T1/T3 或评估用例。
# [PROTOCOL]: 修改同步 Header、目录地图及共享开发 Skill。
name: UI tests
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    name: Plan UI delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      check: ${{ steps.plan.outputs.check }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ui-delivery-ci.mjs plan
  capture:
    name: Capture UI for review
    needs: [plan]
    if: needs.plan.outputs.mode == 'capture'
    runs-on: macos-15
    timeout-minutes: 25
    outputs:
      review: ${{ steps.classify.outputs.review }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-ui-dependencies
      - run: pnpm build
      - name: Capture all behavior and layout cases
        env:
          BOAI_UI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BOAI_UI_PR_NUMBER: ${{ github.event.pull_request.number }}
          BOAI_UI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/ui-regression.mjs candidate-ci --profile github-macos15-arm64 --output .local/ui-candidate
      - id: classify
        run: node scripts/ui-delivery-ci.mjs classify .local/ui-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: ui-candidate-github-macos15-arm64
          path: .local/ui-candidate/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-capture-failure
          path: .local/ui-candidate/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
      - name: Generate UI review report
        if: always()
        run: node scripts/ui-review-report.mjs report .local/ui-candidate .local/ui-review
      - uses: actions/upload-artifact@v4
        id: review
        if: always()
        with:
          name: ui-review-candidate
          path: .local/ui-review/
          retention-days: 3
          if-no-files-found: error
      - name: Publish UI review summary
        if: always()
        env:
          UI_REVIEW_ARTIFACT_URL: ${{ steps.review.outputs.artifact-url }}
        run: node scripts/ui-review-report.mjs summary .local/ui-review
  ui:
    needs: [plan, capture]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.mode == 'verify' ||
       (needs.capture.result == 'success' && needs.capture.outputs.review == 'none'))
    name: UI regression (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ui-dependencies
        id: dependencies
      - run: pnpm build
      - run: node scripts/ui-regression.mjs check --profile github-macos15-arm64 --shard ${{ matrix.shard }}/2 --output .local/ui-ci
      - run: node scripts/ci-result.mjs record-ui-shard .local/ui-ci ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-${{ matrix.shard }}
          path: .local/ui-ci/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
      - name: Generate UI review report
        if: always()
        run: node scripts/ui-review-report.mjs report .local/ui-ci .local/ui-review
      - uses: actions/upload-artifact@v4
        id: review
        if: always()
        with:
          name: ui-review-${{ matrix.shard }}
          path: .local/ui-review/
          retention-days: 3
          if-no-files-found: error
      - name: Publish UI review summary
        if: always()
        env:
          UI_REVIEW_ARTIFACT_URL: ${{ steps.review.outputs.artifact-url }}
        run: node scripts/ui-review-report.mjs summary .local/ui-review
  required:
    name: UI delivery gate
    if: always()
    needs: [plan, capture, ui]
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: actions/download-artifact@v4
        if: needs.ui.result == 'success'
        with:
          name: ui-1
          path: .local/ci-artifacts/ui-1
      - uses: actions/download-artifact@v4
        if: needs.ui.result == 'success'
        with:
          name: ui-2
          path: .local/ci-artifacts/ui-2
      - name: Publish required check after independent evidence verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ui-delivery-ci.mjs finish
