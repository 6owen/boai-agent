# [INPUT]: 面向 main 的 PR、main push 或手动触发；版本化 UI 合同与已接受基线。
# [OUTPUT]: 只执行 UI 回归；Required checks 独立核验当前 SHA 的完整 UI 报告和原件。
# [POS]: 唯一自动测试工作流，不运行模块、模型连接、T1/T3 或评估用例。
# [PROTOCOL]: 修改同步 Header、目录地图及共享开发 Skill。
name: UI tests
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ui:
    name: UI regression
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
          pnpm exec electron --version
      - run: pnpm build
      - run: node scripts/ui-regression.mjs check --profile github-macos15-arm64 --output .local/ui-ci
      - run: node scripts/ci-result.mjs record-ui .local/ui-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui
          path: .local/ui-ci/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
  required:
    name: Required checks
    if: always()
    needs: [ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Check UI job result
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-result.mjs jobs
      - uses: actions/download-artifact@v4
        with:
          name: ui
          path: .local/ci-artifacts/ui
      - run: node scripts/ci-result.mjs gate
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
