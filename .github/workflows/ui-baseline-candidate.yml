# [OUTPUT]: 2026-10-27官方候选一次完整采集并离线生成差异，普通CI比较与独立审阅门禁保持。
# [OUTPUT]: 与普通UI共用精确安装缓存，未命中才从pnpm仓库安装。
# [INPUT]: 明确手动触发的受信仓库分支及固定macOS构建。
# [OUTPUT]: 手动独立云端候选及轻量逐场景差异报告；官方原件审阅，不提供合并资格或自动接受。
# [POS]: 开发侧环境基线采集；无发布/仓库写权限。
# [PROTOCOL]: 一旦本文件变化，必须同步更新Header，并上浮检查所属目录.folder.md。
name: UI baseline candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ui-dependencies
        id: dependencies
      - run: pnpm build
      - id: capture
        run: node scripts/ui-regression.mjs candidate-ci --profile github-macos15-arm64 --output .local/ui-candidate
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ui-candidate-github-macos15-arm64
          path: .local/ui-candidate/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always() && steps.capture.outcome != 'success'
        with:
          name: ui-candidate-failure-evidence
          path: .local/ui-candidate/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
      - name: Generate candidate review report
        if: always()
        run: node scripts/ui-review-report.mjs candidate .local/ui-candidate .local/ui-candidate-review
      - uses: actions/upload-artifact@v4
        id: review
        if: always()
        with:
          name: ui-review
          path: .local/ui-candidate-review/
          retention-days: 3
          if-no-files-found: error
      - name: Publish candidate review summary
        if: always()
        env:
          UI_REVIEW_ARTIFACT_URL: ${{ steps.review.outputs.artifact-url }}
        run: node scripts/ui-review-report.mjs summary .local/ui-candidate-review
