# [INPUT]: 明确手动或固定开发分支push触发的受信仓库分支及固定macOS构建。
# [OUTPUT]: 手动或固定开发分支的独立云端候选；官方原件审阅，不提供合并资格或自动接受。
# [POS]: 开发侧环境基线采集；无发布/仓库写权限。
# [PROTOCOL]: 一旦本文件变化，必须同步更新Header，并上浮检查所属目录.folder.md。
name: UI baseline candidate
on:
  push:
    branches: [infra/ui-environment-profiles]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
          pnpm exec electron --version
      - run: pnpm build
      - id: capture
        run: node scripts/ui-regression.mjs candidate-ci --profile github-macos15-arm64 --output .local/ui-candidate
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ui-candidate-github-macos15-arm64
          path: .local/ui-candidate/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always() && steps.capture.outcome != 'success'
        with:
          name: ui-candidate-failure-evidence
          path: .local/ui-candidate/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
