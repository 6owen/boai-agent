# [INPUT]: PR/main commits and explicit manual runs.
# [OUTPUT]: Magpie-style engineering Test; build CLI artifacts before their tests, no screenshot baseline gate.
# [POS]: Engineering CI; Required checks retains the existing branch-protection name.
# [PROTOCOL]: Update .github/workflows/.folder.md and the shared development skill.
name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    name: Test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm typecheck
      - run: pnpm lint:ui
      - run: pnpm build
      - run: pnpm test
  required:
    name: Required checks
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful engineering tests
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
