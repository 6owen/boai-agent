# [OUTPUT]: PR engineering checks only; full tests require manual dispatch or explicit ci:full.
# [INPUT]: PR commits and explicit manual full runs.
# [OUTPUT]: Daily typecheck/lint; application build, fixed UI and Vitest are opt-in.
# [POS]: Engineering CI; Required checks retains the existing branch-protection name.
# [PROTOCOL]: Update .github/workflows/.folder.md and the shared development skill.
name: Test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    name: Test
    runs-on: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2
      - name: Select Test scope
        id: scope
        run: node scripts/test-ci-plan.mjs prepare
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.mode != 'documentation'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.mode != 'documentation'
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
        if: steps.scope.outputs.mode != 'documentation'
      - run: pnpm typecheck
        if: steps.scope.outputs.mode != 'documentation'
      - run: pnpm lint:ui
        if: steps.scope.outputs.mode != 'documentation'
      - run: pnpm build
        if: steps.scope.outputs.mode == 'full'
      - name: UI behavior checks
        if: steps.scope.outputs.mode == 'full'
        run: pnpm test:ui:behavior
      - name: UI behavior evidence
        if: always() && steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: ui-behavior
          path: .local/ui-behavior
          retention-days: 7
          if-no-files-found: ignore
      - run: pnpm --filter @6owen/avatar-motion test
        if: steps.scope.outputs.mode == 'full'
      - run: pnpm test
        if: steps.scope.outputs.mode == 'full'
      - name: Test scope evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-scope
          path: .local/test-ci
          retention-days: 7
          if-no-files-found: ignore
  required:
    name: Required checks
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful engineering tests
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
