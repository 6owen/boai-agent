# [OUTPUT]: Lightweight PR checks; full Vitest is dispatched on main for release.
name: Test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    name: Test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2
      - name: Select Test scope
        id: scope
        run: node scripts/test-ci-plan.mjs prepare
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.mode != 'documentation'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.mode != 'documentation'
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
        if: steps.scope.outputs.mode != 'documentation'
      - run: pnpm typecheck
        if: steps.scope.outputs.mode != 'documentation'
      - run: pnpm lint:ui
        if: steps.scope.outputs.mode != 'documentation'
      - run: pnpm build
        if: steps.scope.outputs.mode == 'full'
      - name: Global screenshot smoke
        id: global_shot
        continue-on-error: true
        env:
          BOAI_SCREENSHOT_DIR: ${{ runner.temp }}/global-screenshot
        if: steps.scope.outputs.mode == 'full'
        run: |
          pnpm test:bddgen
          pnpm exec playwright test --grep @global-screenshot --reporter=line
          test -s "$BOAI_SCREENSHOT_DIR/global.png"
      - name: Report screenshot failure
        if: always() && steps.global_shot.outcome == 'failure'
        run: echo 'Global screenshot failed. Inspect the screenshot step for details.' >> "$GITHUB_STEP_SUMMARY"
      - name: Global screenshot artifact
        continue-on-error: true
        if: always() && steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: global-screenshot
          path: ${{ runner.temp }}/global-screenshot/global.png
          retention-days: 7
          if-no-files-found: ignore
      - run: pnpm --filter @6owen/avatar-motion test
        if: steps.scope.outputs.mode == 'full'
      - run: pnpm test
        if: steps.scope.outputs.mode == 'full'
      - name: Test scope evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-scope
          path: .local/test-ci
          retention-days: 7
          if-no-files-found: ignore
  required:
    name: Required checks
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful engineering tests
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
