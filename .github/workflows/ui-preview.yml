# [OUTPUT]: One PNG of the current PR from an isolated Playwright-BDD scenario.
name: UI preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

concurrency:
  group: ui-preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect:
    if: (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ui-preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      ui: ${{ steps.detect.outputs.ui }}
      sha: ${{ steps.detect.outputs.sha }}
      number: ${{ steps.detect.outputs.number }}
      target: ${{ steps.detect.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      - id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/ui-preview/publish.mjs detect
  record:
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci
          sparse-checkout: |
            tests/e2e/features
            tests/e2e/steps
          persist-credentials: false
      # the fork's code, on purpose: this job is the one meant to run it,
      # with a read-only token and no credentials left in the checkout
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.sha }}
          path: pr
          submodules: recursive
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: pr/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pr/pnpm-lock.yaml
      - name: Dependencies
        working-directory: pr
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build BOAI
        working-directory: pr
        run: pnpm build
      - name: Capture one PR screenshot
        working-directory: pr
        env:
          BOAI_SCREENSHOT_TARGET: ${{ needs.detect.outputs.target }}
          BOAI_SCREENSHOT_DIR: ${{ github.workspace }}/out
        run: |
          # Use this workflow's capture steps even when replaying an older PR.
          cp ../ci/tests/e2e/features/ci-screenshot.feature tests/e2e/features/
          cp ../ci/tests/e2e/steps/ci-screenshot.steps.ts tests/e2e/steps/
          pnpm test:bddgen
          pnpm exec playwright test --grep @pr-screenshot --reporter=line
          test -s ../out/preview.png
          git rev-parse HEAD > ../out/source-sha
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: |
            out/preview.png
            out/source-sha
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [detect, record]
    if: always() && needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    environment: ui-preview-publish
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ui-preview
          path: out
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ needs.detect.outputs.number }}
          SHA: ${{ needs.detect.outputs.sha }}
          OUT_DIR: out
          RECORD_RESULT: ${{ needs.record.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/ui-preview/publish.mjs screenshot
